<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attack on Titan - Stream Hub</title>
  <meta name="theme-color" content="#121214">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg: #0f0f12;
      --card-bg: #18181f;
      --card-hover: #22222b;
      --accent: #e50914;
      --accent-hover: #b80710;
      --cyan: #00adb5;
      --green: #4ade80;
      --yellow: #f59e0b;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --border: #27272e;
    }
    body.rumbling-mode {
      --bg: #0d0607;
      --card-bg: #1f0d0f;
      --card-hover: #301317;
      --accent: #ff2a2a;
      --border: #4d161a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 70px;
      transition: background-color 0.5s ease;
    }
    header {
      background-color: #16161c;
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: background-color 0.5s;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .logo:active i {
      transform: scale(1.25) rotate(15deg);
    }
    .logo i {
      transition: transform 0.2s;
    }
    .logo h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--accent);
      text-transform: uppercase;
    }
    .logo span {
      font-size: 0.75rem;
      color: var(--green);
      background: rgba(74, 222, 128, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      justify-content: flex-end;
    }
    .search-box {
      position: relative;
      max-width: 280px;
      min-width: 160px;
      width: 100%;
    }
    .search-box input {
      width: 100%;
      background: #23232b;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 12px 8px 34px;
      border-radius: 20px;
      font-size: 0.88rem;
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.85rem;
    }
    .header-resume-btn {
      background: rgba(229, 9, 20, 0.15);
      border: 1px solid rgba(229, 9, 20, 0.4);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .header-resume-btn:hover { background: var(--accent); }

    /* Player Container */
    #player-section {
      display: none;
      background: #000;
      position: relative;
      width: 100%;
      max-width: 1060px;
      margin: 0 auto 20px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.85);
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
    }
    video#main-video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      outline: none;
    }
    video::cue {
      background: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      font-weight: 700;
      font-size: 1.18rem;
      line-height: 1.4;
      text-shadow: 0 0 4px #000;
    }

    /* Floating On-Screen Skip Buttons */
    .skip-btn {
      position: absolute;
      bottom: 65px;
      right: 20px;
      background: rgba(229, 9, 20, 0.95);
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.4);
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 35;
      box-shadow: 0 4px 15px rgba(0,0,0,0.7);
      animation: pulse 1.5s infinite;
      backdrop-filter: blur(4px);
    }
    .skip-btn.ending {
      background: rgba(0, 173, 181, 0.95);
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    /* Player Header / Details */
    .player-details {
      background: #18181f;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      border-top: 1px solid var(--border);
    }
    .player-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: #fff;
    }
    .player-meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .quick-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-skip-jump {
      background: #23232b;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-skip-jump:hover { background: #2f2f3a; }
    .btn-skip-jump.intro { color: #ffca28; }
    .btn-skip-jump.outro { color: var(--cyan); }

    /* Next Episode Overlay */
    .next-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      z-index: 40;
      text-align: center;
      padding: 20px;
    }
    .next-overlay h3 { font-size: 1.3rem; color: #fff; }
    .next-overlay p { color: var(--muted); font-size: 0.95rem; }
    .next-overlay-actions {
      display: flex;
      gap: 12px;
      margin-top: 5px;
    }
    .btn-next-now {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn-next-cancel {
      background: #27272e;
      color: #ccc;
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Resume Toast Popup (Netflix Style) */
    .resume-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(24, 24, 31, 0.96);
      border: 1px solid #3f3f4e;
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 14px 18px;
      display: none;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.85);
      z-index: 100;
      backdrop-filter: blur(8px);
      animation: slideUp 0.4s ease forwards;
      max-width: 400px;
    }
    @keyframes slideUp {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .resume-toast-info {
      flex: 1;
    }
    .resume-toast-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }
    .resume-toast-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 3px;
    }
    .resume-toast-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .resume-toast-btn:hover { background: var(--accent-hover); }
    .resume-toast-close {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1rem;
      cursor: pointer;
      padding: 4px;
    }
    .resume-toast-close:hover { color: #fff; }

    /* Category Nav Tabs */
    .tabs-nav {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      overflow-x: auto;
      scrollbar-width: none;
      background: #121216;
      border-bottom: 1px solid var(--border);
    }
    .tabs-nav::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: #1c1c24;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Episode Grid */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, background-color 0.2s, border-color 0.2s;
      cursor: pointer;
    }
    .card:hover {
      background: var(--card-hover);
      border-color: #3f3f4e;
      transform: translateY(-2px);
    }
    .card.playing {
      border-color: var(--accent);
      background: #201a1c;
    }
    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }
    .badge {
      background: #2a2a35;
      color: var(--cyan);
      font-weight: 700;
      font-size: 0.75rem;
      padding: 3px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .badge.movie { color: #f59e0b; }
    .badge.ova { color: #a855f7; }
    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
    }
    .card-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-actions {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .play-action {
      background: var(--accent);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      cursor: pointer;
    }
    .watched-tag {
      color: var(--green);
      font-size: 0.75rem;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 4px;
    }
    .watched-tag.show { display: flex; }

    /* =========================================
       EPIC AOT EASTER EGG OVERLAYS & ANIMATIONS
       ========================================= */
    .easter-egg-banner {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, rgba(0,0,0,0.85) 0%, rgba(15,0,0,0.95) 100%);
      z-index: 999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: modalFadeIn 0.3s ease;
      cursor: pointer;
      padding: 20px;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .easter-egg-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      max-width: 600px;
    }
    .easter-egg-title {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .easter-egg-title.sasageyo {
      color: #4ade80;
      text-shadow: 0 0 20px rgba(74, 222, 128, 0.8), 0 0 40px rgba(74, 222, 128, 0.4);
    }
    .easter-egg-title.tatakae {
      color: #ff2a2a;
      text-shadow: 0 0 25px rgba(255, 42, 42, 0.9), 0 0 50px rgba(255, 42, 42, 0.5);
    }
    .easter-egg-subtitle {
      font-size: 1.2rem;
      color: #e4e4e7;
      font-weight: 600;
      font-style: italic;
    }
    .easter-egg-icon {
      font-size: 4rem;
      animation: floatIcon 2s ease-in-out infinite alternate;
    }
    @keyframes floatIcon {
      from { transform: translateY(-5px) scale(1); }
      to { transform: translateY(8px) scale(1.1); }
    }
    .easter-egg-tip {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 15px;
    }
    .screen-shake {
      animation: titanTremor 0.5s ease-in-out;
    }
    @keyframes titanTremor {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-8px, 6px); }
      40% { transform: translate(8px, -6px); }
      60% { transform: translate(-5px, 3px); }
      80% { transform: translate(5px, -3px); }
      100% { transform: translate(0, 0); }
    }

    #titan-flash {
      position: fixed;
      inset: 0;
      background: #ffd700;
      opacity: 0;
      pointer-events: none;
      z-index: 1000;
      transition: opacity 0.1s ease;
    }
    #titan-flash.flash {
      opacity: 0.75;
    }

    @media (max-width: 600px) {
      header { padding: 10px 14px; }
      .grid { grid-template-columns: 1fr; }
      .container { padding: 12px; }
      .skip-btn { bottom: 50px; right: 12px; padding: 8px 14px; font-size: 0.85rem; }
      .resume-toast { bottom: 16px; left: 16px; right: 16px; max-width: none; }
    }
  </style>
</head>
<body>

  <!-- Titan Lightning Screen Flash Layer -->
  <div id="titan-flash"></div>

  <!-- Easter Egg Modal Overlay -->
  <div id="easter-egg-modal" class="easter-egg-banner" onclick="dismissEasterEgg()">
    <div class="easter-egg-content">
      <div id="ee-icon" class="easter-egg-icon">⚔️</div>
      <div id="ee-title" class="easter-egg-title sasageyo">SHINZOU WO SASAGEYO!</div>
      <div id="ee-sub" class="easter-egg-subtitle">"Dedicate your hearts!" — 心臓を捧げよ!</div>
      <div class="easter-egg-tip">(Click anywhere to dismiss)</div>
    </div>
  </div>

  <header>
    <div class="logo" id="main-logo" onclick="onLogoClick()">
      <i class="fa-solid fa-shield-halved" style="color: var(--accent); font-size: 1.4rem;"></i>
      <div>
        <h1>Attack on Titan</h1>
      </div>
      <span>1080p Dub</span>
    </div>
    <div class="header-right">
      <button id="header-resume-btn" class="header-resume-btn" onclick="resumeLastPlayed()">
        <i class="fa-solid fa-play"></i> <span id="header-resume-text">Resume S01E01</span>
      </button>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search" placeholder="Search 97 episodes...">
      </div>
    </div>
  </header>

  <!-- Video Player Section -->
  <div id="player-section">
    <div class="video-wrapper" id="video-wrapper">
      <video id="main-video" controls playsinline preload="auto">
        <track id="sub-track" kind="subtitles" srclang="en" label="English" default>
      </video>

      <!-- Floating Skip Buttons -->
      <button id="skip-btn" class="skip-btn" onclick="skipIntro()">
        <i class="fa-solid fa-forward"></i> Skip Opening (Tab)
      </button>

      <button id="skip-outro-btn" class="skip-btn ending" onclick="skipOutro()">
        <i class="fa-solid fa-forward-step"></i> Skip Ending
      </button>

      <!-- Next Episode Overlay -->
      <div id="next-overlay" class="next-overlay">
        <h3 id="next-ep-title">Next Episode</h3>
        <p>Auto-playing in <span id="countdown-num" style="color:var(--green); font-weight:bold;">5</span>s...</p>
        <div class="next-overlay-actions">
          <button class="btn-next-now" onclick="playNextEpisode(true)"><i class="fa-solid fa-play"></i> Play Now</button>
          <button class="btn-next-cancel" onclick="cancelAutoNext()">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Episode Details & Quick Jump Buttons -->
    <div class="player-details">
      <div>
        <div id="current-title" class="player-title">Episode Title</div>
        <div id="current-meta" class="player-meta">Season 1 • 1080p English Dub</div>
      </div>
      <div class="quick-controls">
        <button class="btn-skip-jump intro" onclick="skipIntro()"><i class="fa-solid fa-forward"></i> Jump Intro</button>
        <button class="btn-skip-jump outro" onclick="skipOutro()"><i class="fa-solid fa-forward-step"></i> Jump Outro</button>
        <button class="btn-skip-jump" onclick="playNextEpisode(true)"><i class="fa-solid fa-step-forward"></i> Next</button>
        <label style="font-size:0.75rem; color:var(--muted); display:flex; align-items:center; gap:4px; margin-left:8px; cursor:pointer;">
          <input type="checkbox" id="auto-skip-chk"> Auto-Skip OP
        </label>
      </div>
    </div>
  </div>

  <!-- Category Filter Tabs -->
  <div class="tabs-nav">
    <button class="tab-btn active" onclick="filterCategory('All')">All (97)</button>
    <button class="tab-btn" onclick="filterCategory('1')">Season 1 (25)</button>
    <button class="tab-btn" onclick="filterCategory('2')">Season 2 (12)</button>
    <button class="tab-btn" onclick="filterCategory('3')">Season 3 (22)</button>
    <button class="tab-btn" onclick="filterCategory('4')">The Final Season (30)</button>
    <button class="tab-btn" onclick="filterCategory('OVA')">Official OVAs (8)</button>
  </div>

  <!-- Main Episode Grid -->
  <div class="container">
    <div id="episodes-grid" class="grid"></div>
  </div>

  <!-- Resume Popup Toast (Netflix Style) -->
  <div id="resume-toast" class="resume-toast">
    <div class="resume-toast-info">
      <div class="resume-toast-title" id="toast-title">Continue Watching?</div>
      <div class="resume-toast-meta" id="toast-meta">Episode details...</div>
    </div>
    <button class="resume-toast-btn" onclick="resumeLastPlayed()"><i class="fa-solid fa-play"></i> Resume</button>
    <button class="resume-toast-close" onclick="closeResumeToast()"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <script>
    let allEpisodes = [];
    let currentCategory = 'All';
    let currentEpisodeIndex = -1;
    let watchedHistory = JSON.parse(localStorage.getItem('aot_watched') || '[]');
    let lastPlayed = JSON.parse(localStorage.getItem('aot_last_played') || 'null');
    let autoNextTimer = null;
    let toastHideTimeout = null;

    const video = document.getElementById('main-video');
    const skipBtn = document.getElementById('skip-btn');
    const skipOutroBtn = document.getElementById('skip-outro-btn');
    const subTrack = document.getElementById('sub-track');

    const playerSection = document.getElementById('player-section');
    const currentTitle = document.getElementById('current-title');
    const currentMeta = document.getElementById('current-meta');
    const autoSkipChk = document.getElementById('auto-skip-chk');
    const nextOverlay = document.getElementById('next-overlay');
    const nextEpTitle = document.getElementById('next-ep-title');
    const countdownNum = document.getElementById('countdown-num');

    const resumeToast = document.getElementById('resume-toast');
    const toastTitle = document.getElementById('toast-title');
    const toastMeta = document.getElementById('toast-meta');
    const headerResumeBtn = document.getElementById('header-resume-btn');
    const headerResumeText = document.getElementById('header-resume-text');

    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) return "00:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Load episodes catalog
    fetch('episodes.json')
      .then(res => res.json())
      .then(data => {
        allEpisodes = data;
        renderEpisodes();
        checkAndShowResumePrompt();
      })
      .catch(err => {
        console.error('Failed to load episodes.json:', err);
      });

    function checkAndShowResumePrompt() {
      if (lastPlayed && lastPlayed.id) {
        const ep = allEpisodes.find(e => e.id === lastPlayed.id);
        if (ep) {
          const timeStr = lastPlayed.time ? formatTime(lastPlayed.time) : "00:00";
          headerResumeText.textContent = `Resume ${ep.id}`;
          headerResumeBtn.style.display = 'inline-flex';

          toastTitle.textContent = `${ep.id}: ${ep.title || ep.filename}`;
          toastMeta.textContent = `Resume from ${timeStr}`;
          resumeToast.style.display = 'flex';

          toastHideTimeout = setTimeout(() => {
            closeResumeToast();
          }, 10000);
        }
      }
    }

    function closeResumeToast() {
      clearTimeout(toastHideTimeout);
      resumeToast.style.display = 'none';
    }

    function resumeLastPlayed() {
      closeResumeToast();
      if (lastPlayed && lastPlayed.id) {
        playEpisode(lastPlayed.id, lastPlayed.time || 0);
      } else if (allEpisodes.length > 0) {
        playEpisode(allEpisodes[0].id, 0);
      }
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.startsWith(cat === '1' ? 'Season 1' : cat === '2' ? 'Season 2' : cat === '3' ? 'Season 3' : cat === '4' ? 'The Final' : cat === 'OVA' ? 'Official' : 'All'));
      });
      renderEpisodes();
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();

      // Search bar Easter Egg checks
      if (q === 'sasageyo') {
        triggerSasageyo();
      } else if (q === 'tatakae' || q === 'rumbling') {
        triggerTatakae();
      }

      renderEpisodes(q);
    });

    function renderEpisodes(query = '') {
      const grid = document.getElementById('episodes-grid');
      grid.innerHTML = '';

      const filtered = allEpisodes.filter(ep => {
        if (currentCategory === '1' && ep.season_num !== 1) return false;
        if (currentCategory === '2' && ep.season_num !== 2) return false;
        if (currentCategory === '3' && ep.season_num !== 3) return false;
        if (currentCategory === '4' && ep.season_num !== 4) return false;
        if (currentCategory === 'OVA' && ep.type !== 'ova' && ep.season_num !== 0) return false;

        if (query) {
          const matchTitle = (ep.title || '').toLowerCase().includes(query);
          const matchId = (ep.id || '').toLowerCase().includes(query);
          if (!matchTitle && !matchId) return false;
        }
        return true;
      });

      filtered.forEach((ep, idx) => {
        const isWatched = watchedHistory.includes(ep.id);
        const isCurrent = (currentEpisodeIndex !== -1 && allEpisodes[currentEpisodeIndex].id === ep.id);
        const card = document.createElement('div');
        card.className = `card ${isCurrent ? 'playing' : ''}`;
        card.onclick = () => playEpisode(ep.id);

        const badgeClass = ep.type === 'movie' ? 'badge movie' : ep.type === 'ova' ? 'badge ova' : 'badge';

        card.innerHTML = `
          <div>
            <div class="card-top">
              <span class="${badgeClass}">${ep.id}</span>
              <div class="card-title">${ep.title || ep.filename}</div>
            </div>
            <div class="card-meta">
              <span>${ep.season_title || ''}</span>
              <span>•</span>
              <span>1080p Dub</span>
              ${ep.size_mb ? `<span>• ${ep.size_mb} MB</span>` : ''}
            </div>
          </div>
          <div class="card-actions">
            <button class="play-action"><i class="fa-solid fa-play"></i> ${isCurrent ? 'Playing' : 'Play'}</button>
            <div class="watched-tag ${isWatched ? 'show' : ''}"><i class="fa-solid fa-check"></i> Watched</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function playEpisode(epId, startTime = 0) {
      cancelAutoNext();
      closeResumeToast();
      const epIndex = allEpisodes.findIndex(e => e.id === epId);
      if (epIndex === -1) return;

      currentEpisodeIndex = epIndex;
      const ep = allEpisodes[epIndex];

      if (!watchedHistory.includes(ep.id)) {
        watchedHistory.push(ep.id);
        localStorage.setItem('aot_watched', JSON.stringify(watchedHistory));
      }

      lastPlayed = { id: ep.id, title: ep.title || ep.filename, time: startTime, timestamp: Date.now() };
      localStorage.setItem('aot_last_played', JSON.stringify(lastPlayed));
      headerResumeText.textContent = `Resume ${ep.id}`;
      headerResumeBtn.style.display = 'inline-flex';

      renderEpisodes();

      playerSection.style.display = 'block';
      playerSection.scrollIntoView({ behavior: 'smooth' });

      currentTitle.textContent = `${ep.id}: ${ep.title || ep.filename}`;
      currentMeta.textContent = `${ep.season_title || ''} • 1080p English Dub`;

      // Native Subtitle Track Loading
      const subFile = ep.vtt_path || ep.subtitle_path;
      if (subFile) {
        subTrack.src = encodeURI(subFile);
        setTimeout(() => {
          if (video.textTracks && video.textTracks.length > 0) {
            video.textTracks[0].mode = 'showing';
          }
        }, 150);
      } else {
        subTrack.src = '';
      }

      video.src = ep.stream_url;

      if (startTime > 0) {
        video.currentTime = startTime;
      }

      video.play().catch(e => console.log("Play interrupted:", e));
    }

    // Timeupdate
    let lastSaveTime = 0;
    video.addEventListener('timeupdate', () => {
      if (currentEpisodeIndex === -1) return;
      const ep = allEpisodes[currentEpisodeIndex];
      const ts = ep.timestamps || {};
      const cur = video.currentTime;

      // Update last played log in localStorage
      const now = Date.now();
      if (now - lastSaveTime > 4000 && cur > 5) {
        lastSaveTime = now;
        lastPlayed = { id: ep.id, title: ep.title || ep.filename, time: cur, timestamp: now };
        localStorage.setItem('aot_last_played', JSON.stringify(lastPlayed));
      }

      // Check Opening Skip
      if (ts.op_start && ts.op_end && cur >= ts.op_start && cur < ts.op_end) {
        if (autoSkipChk.checked) {
          video.currentTime = ts.op_end;
          skipBtn.style.display = 'none';
        } else {
          skipBtn.style.display = 'flex';
          skipBtn.innerHTML = `<i class="fa-solid fa-forward"></i> Skip Opening (${Math.ceil(ts.op_end - cur)}s)`;
        }
      } else {
        skipBtn.style.display = 'none';
      }

      // Check Ending Skip
      if (ts.ed_start && ts.ed_end && cur >= ts.ed_start && cur < ts.ed_end) {
        skipOutroBtn.style.display = 'flex';
      } else {
        skipOutroBtn.style.display = 'none';
      }
    });

    function skipIntro() {
      if (currentEpisodeIndex === -1) return;
      const ep = allEpisodes[currentEpisodeIndex];
      const ts = ep.timestamps || {};
      if (ts.op_end) {
        video.currentTime = ts.op_end;
        skipBtn.style.display = 'none';
      } else {
        video.currentTime += 85;
      }
    }

    function skipOutro() {
      if (currentEpisodeIndex === -1) return;
      const ep = allEpisodes[currentEpisodeIndex];
      const ts = ep.timestamps || {};
      if (ts.ed_end) {
        video.currentTime = ts.ed_end;
      } else {
        playNextEpisode(true);
      }
      skipOutroBtn.style.display = 'none';
    }

    function playPrevEpisode() {
      if (currentEpisodeIndex > 0) {
        playEpisode(allEpisodes[currentEpisodeIndex - 1].id);
      }
    }

    function playNextEpisode(immediate = false) {
      cancelAutoNext();
      if (currentEpisodeIndex !== -1 && currentEpisodeIndex + 1 < allEpisodes.length) {
        playEpisode(allEpisodes[currentEpisodeIndex + 1].id);
      }
    }

    // Binge Mode Auto-Countdown
    video.addEventListener('ended', () => {
      if (currentEpisodeIndex !== -1 && currentEpisodeIndex + 1 < allEpisodes.length) {
        const nextEp = allEpisodes[currentEpisodeIndex + 1];
        nextEpTitle.textContent = `Up Next: ${nextEp.id} - ${nextEp.title || nextEp.filename}`;
        nextOverlay.style.display = 'flex';
        let countdown = 5;
        countdownNum.textContent = countdown;

        autoNextTimer = setInterval(() => {
          countdown -= 1;
          countdownNum.textContent = countdown;
          if (countdown <= 0) {
            cancelAutoNext();
            playNextEpisode(true);
          }
        }, 1000);
      }
    });

    function cancelAutoNext() {
      if (autoNextTimer) {
        clearInterval(autoNextTimer);
        autoNextTimer = null;
      }
      nextOverlay.style.display = 'none';
    }

    // =========================================
    // AOT EASTER EGGS ENGINE (Web Audio + Effects)
    // =========================================
    const eeModal = document.getElementById('easter-egg-modal');
    const eeTitle = document.getElementById('ee-title');
    const eeSub = document.getElementById('ee-sub');
    const eeIcon = document.getElementById('ee-icon');
    const titanFlash = document.getElementById('titan-flash');

    let audioCtx = null;

    function playSoundEffect(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        if (type === 'thunder') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.8);
          gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.8);
        } else if (type === 'fanfare') {
          const notes = [261.63, 329.63, 392.00, 523.25];
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + (idx * 0.1) + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + (idx * 0.1));
            osc.stop(audioCtx.currentTime + 1.3);
          });
        }
      } catch (e) {
        console.log("Audio not allowed yet:", e);
      }
    }

    function triggerScreenEffects() {
      titanFlash.classList.add('flash');
      setTimeout(() => titanFlash.classList.remove('flash'), 120);

      document.body.classList.add('screen-shake');
      setTimeout(() => document.body.classList.remove('screen-shake'), 500);
    }

    function triggerSasageyo() {
      playSoundEffect('fanfare');
      triggerScreenEffects();

      eeIcon.innerHTML = '🛡️⚔️';
      eeTitle.className = 'easter-egg-title sasageyo';
      eeTitle.textContent = 'SHINZOU WO SASAGEYO!';
      eeSub.textContent = '"Dedicate your hearts! Give your lives for humanity!" — 心臓を捧げよ!';
      eeModal.style.display = 'flex';
    }

    function triggerTatakae() {
      playSoundEffect('thunder');
      triggerScreenEffects();

      document.body.classList.toggle('rumbling-mode');

      eeIcon.innerHTML = '⚡🔥';
      eeTitle.className = 'easter-egg-title tatakae';
      eeTitle.textContent = 'TATAKAE. TATAKAE.';
      eeSub.textContent = '"If you don\'t fight, you can\'t win. Fight. FIGHT!" — 戦え。戦え。';
      eeModal.style.display = 'flex';
    }

    function dismissEasterEgg() {
      eeModal.style.display = 'none';
    }

    let logoClicks = 0;
    let logoClickTimer = null;
    function onLogoClick() {
      logoClicks++;
      clearTimeout(logoClickTimer);
      logoClickTimer = setTimeout(() => { logoClicks = 0; }, 1200);

      if (logoClicks >= 3) {
        logoClicks = 0;
        triggerSasageyo();
      }
    }

    let keyBuffer = '';
    document.addEventListener('keydown', (e) => {
      if (document.activeElement === document.getElementById('search')) return;

      const key = e.key.toLowerCase();
      keyBuffer += key;
      if (keyBuffer.length > 15) keyBuffer = keyBuffer.slice(-15);

      if (keyBuffer.includes('sasageyo') || keyBuffer.includes('shinzou')) {
        keyBuffer = '';
        triggerSasageyo();
      } else if (keyBuffer.includes('tatakae') || keyBuffer.includes('rumbling')) {
        keyBuffer = '';
        triggerTatakae();
      } else if (key === 'tab' || key === 's') {
        e.preventDefault();
        skipIntro();
      } else if (key === 'n') {
        e.preventDefault();
        playNextEpisode(true);
      } else if (key === 'p') {
        e.preventDefault();
        playPrevEpisode();
      }
    });
  </script>
</body>
</html>
