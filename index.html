<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attack on Titan - Stream Hub</title>
  <meta name="theme-color" content="#121214">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #0f0f12;
      --card-bg: #18181f;
      --card-hover: #22222b;
      --accent: #e50914;
      --accent-hover: #b80710;
      --cyan: #00adb5;
      --green: #4ade80;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --border: #27272e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 50px;
    }
    header {
      background-color: #16161c;
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--accent);
      text-transform: uppercase;
    }
    .logo span {
      font-size: 0.75rem;
      color: var(--green);
      background: rgba(74, 222, 128, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .search-box {
      position: relative;
      flex: 1;
      max-width: 320px;
      min-width: 180px;
    }
    .search-box input {
      width: 100%;
      background: #23232b;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 12px 8px 34px;
      border-radius: 20px;
      font-size: 0.9rem;
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.85rem;
    }

    /* Player Container */
    #player-section {
      display: none;
      background: #000;
      position: relative;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto 20px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
    }
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      outline: none;
    }
    .skip-btn {
      position: absolute;
      bottom: 80px;
      right: 20px;
      background: rgba(229, 9, 20, 0.9);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 20;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .player-controls {
      background: #18181f;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .player-title {
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
    }
    .player-actions {
      display: flex;
      gap: 8px;
    }
    .vlc-open-btn {
      background: #27272e;
      color: var(--cyan);
      border: 1px solid var(--cyan);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Category Nav */
    .tabs-nav {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      overflow-x: auto;
      scrollbar-width: none;
      background: #121216;
      border-bottom: 1px solid var(--border);
    }
    .tabs-nav::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: #1c1c24;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Episode Grid */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, background-color 0.2s;
      cursor: pointer;
    }
    .card:hover {
      background: var(--card-hover);
      transform: translateY(-2px);
    }
    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }
    .badge {
      background: #2a2a35;
      color: var(--cyan);
      font-weight: 700;
      font-size: 0.75rem;
      padding: 3px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .badge.movie { color: #f59e0b; }
    .badge.ova { color: #a855f7; }
    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
    }
    .card-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-actions {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .play-action {
      background: var(--accent);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
    }
    .watched-tag {
      color: var(--green);
      font-size: 0.75rem;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 4px;
    }
    .watched-tag.show { display: flex; }

    @media (max-width: 600px) {
      header { padding: 10px 14px; }
      .grid { grid-template-columns: 1fr; }
      .container { padding: 12px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <i class="fa-solid fa-shield-halved" style="color: var(--accent); font-size: 1.4rem;"></i>
      <div>
        <h1>Attack on Titan</h1>
      </div>
      <span>1080p Dub</span>
    </div>
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search" placeholder="Search 97 episodes...">
    </div>
  </header>

  <!-- Video Player Section -->
  <div id="player-section">
    <div class="video-wrapper">
      <video id="main-video" controls playsinline preload="auto">
        <track id="sub-track" kind="subtitles" srclang="en" label="English" default>
      </video>
      <button id="skip-btn" class="skip-btn" onclick="skipIntro()">
        <i class="fa-solid fa-forward"></i> Skip Opening
      </button>
    </div>
    <div class="player-controls">
      <div>
        <div id="current-title" class="player-title">Episode Title</div>
        <div id="current-meta" style="font-size: 0.75rem; color: var(--muted); margin-top: 2px;">Season 1 • 1080p English Dub</div>
      </div>
      <div class="player-actions">
        <a id="vlc-link" class="vlc-open-btn" href="#" target="_blank">
          <i class="fa-solid fa-play"></i> Open in VLC App
        </a>
      </div>
    </div>
  </div>

  <!-- Category Filter Tabs -->
  <div class="tabs-nav">
    <button class="tab-btn active" onclick="filterCategory('All')">All (97)</button>
    <button class="tab-btn" onclick="filterCategory('1')">Season 1 (25)</button>
    <button class="tab-btn" onclick="filterCategory('2')">Season 2 (12)</button>
    <button class="tab-btn" onclick="filterCategory('3')">Season 3 (22)</button>
    <button class="tab-btn" onclick="filterCategory('4')">The Final Season (30)</button>
    <button class="tab-btn" onclick="filterCategory('OVA')">Official OVAs (8)</button>
  </div>

  <!-- Main Episode Grid -->
  <div class="container">
    <div id="episodes-grid" class="grid">
      <!-- Injected by JavaScript -->
    </div>
  </div>

  <script>
    let allEpisodes = [];
    let currentCategory = 'All';
    let currentEpisodeIndex = -1;
    let watchedHistory = JSON.parse(localStorage.getItem('aot_watched') || '[]');

    const video = document.getElementById('main-video');
    const skipBtn = document.getElementById('skip-btn');
    const playerSection = document.getElementById('player-section');
    const currentTitle = document.getElementById('current-title');
    const currentMeta = document.getElementById('current-meta');
    const vlcLink = document.getElementById('vlc-link');
    const subTrack = document.getElementById('sub-track');

    // Load episodes catalog
    fetch('episodes.json')
      .then(res => res.json())
      .then(data => {
        allEpisodes = data;
        renderEpisodes();
      })
      .catch(err => {
        console.error('Failed to load episodes.json:', err);
      });

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.startsWith(cat === '1' ? 'Season 1' : cat === '2' ? 'Season 2' : cat === '3' ? 'Season 3' : cat === '4' ? 'The Final' : cat === 'OVA' ? 'Official' : 'All'));
      });
      renderEpisodes();
    }

    document.getElementById('search').addEventListener('input', (e) => {
      renderEpisodes(e.target.value.toLowerCase().trim());
    });

    function renderEpisodes(query = '') {
      const grid = document.getElementById('episodes-grid');
      grid.innerHTML = '';

      const filtered = allEpisodes.filter(ep => {
        if (currentCategory === '1' && ep.season_num !== 1) return false;
        if (currentCategory === '2' && ep.season_num !== 2) return false;
        if (currentCategory === '3' && ep.season_num !== 3) return false;
        if (currentCategory === '4' && ep.season_num !== 4) return false;
        if (currentCategory === 'OVA' && ep.type !== 'ova' && ep.season_num !== 0) return false;

        if (query) {
          const matchTitle = (ep.title || '').toLowerCase().includes(query);
          const matchId = (ep.id || '').toLowerCase().includes(query);
          if (!matchTitle && !matchId) return false;
        }
        return true;
      });

      filtered.forEach((ep, idx) => {
        const isWatched = watchedHistory.includes(ep.id);
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => playEpisode(ep.id);

        const badgeClass = ep.type === 'movie' ? 'badge movie' : ep.type === 'ova' ? 'badge ova' : 'badge';

        card.innerHTML = `
          <div>
            <div class="card-top">
              <span class="${badgeClass}">${ep.id}</span>
              <div class="card-title">${ep.title || ep.filename}</div>
            </div>
            <div class="card-meta">
              <span>${ep.season_title || ''}</span>
              <span>•</span>
              <span>1080p Dub</span>
              ${ep.size_mb ? `<span>• ${ep.size_mb} MB</span>` : ''}
            </div>
          </div>
          <div class="card-actions">
            <button class="play-action"><i class="fa-solid fa-play"></i> Play</button>
            <div class="watched-tag ${isWatched ? 'show' : ''}"><i class="fa-solid fa-check"></i> Watched</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function playEpisode(epId) {
      const epIndex = allEpisodes.findIndex(e => e.id === epId);
      if (epIndex === -1) return;

      currentEpisodeIndex = epIndex;
      const ep = allEpisodes[epIndex];

      // Mark watched
      if (!watchedHistory.includes(ep.id)) {
        watchedHistory.push(ep.id);
        localStorage.setItem('aot_watched', JSON.stringify(watchedHistory));
        renderEpisodes();
      }

      playerSection.style.display = 'block';
      playerSection.scrollIntoView({ behavior: 'smooth' });

      currentTitle.textContent = `${ep.id}: ${ep.title || ep.filename}`;
      currentMeta.textContent = `${ep.season_title || ''} • 1080p English Dub`;
      vlcLink.href = `vlc://${ep.stream_url}`;

      // Convert .srt to WebVTT on the fly for browser player
      if (ep.subtitle_path) {
        fetch(ep.subtitle_path)
          .then(res => res.text())
          .then(srtText => {
            const vttText = "WEBVTT\n\n" + srtText.replace(/(\d+:\d+:\d+),(\d+)/g, "$1.$2");
            const blob = new Blob([vttText], { type: 'text/vtt' });
            subTrack.src = URL.createObjectURL(blob);
          })
          .catch(() => { subTrack.src = ''; });
      } else {
        subTrack.src = '';
      }

      video.src = ep.stream_url;
      video.play().catch(e => console.log("Auto-play prevented:", e));
    }

    // Auto Skip Button Monitor
    video.addEventListener('timeupdate', () => {
      if (currentEpisodeIndex === -1) return;
      const ep = allEpisodes[currentEpisodeIndex];
      const ts = ep.timestamps || {};

      if (ts.op_start && ts.op_end) {
        if (video.currentTime >= ts.op_start && video.currentTime < ts.op_end) {
          skipBtn.style.display = 'flex';
          return;
        }
      }
      skipBtn.style.display = 'none';
    });

    function skipIntro() {
      if (currentEpisodeIndex === -1) return;
      const ep = allEpisodes[currentEpisodeIndex];
      const ts = ep.timestamps || {};
      if (ts.op_end) {
        video.currentTime = ts.op_end;
        skipBtn.style.display = 'none';
      }
    }

    // Always-On Binge Mode: Auto Play Next Episode
    video.addEventListener('ended', () => {
      if (currentEpisodeIndex !== -1 && currentEpisodeIndex + 1 < allEpisodes.length) {
        playEpisode(allEpisodes[currentEpisodeIndex + 1].id);
      }
    });
  </script>
</body>
</html>
